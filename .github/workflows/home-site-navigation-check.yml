name: ホーム・現場ナビゲーションの検証
on:
  push:
    paths:
      - 'index.html'
      - 'sw.js'
      - 'tests/test_weather_watch_sw.cjs'
      - 'weather-watch-auto.js'
      - 'tests/test_weather_watch_auto.cjs'
      - 'location-label.js'
      - 'tests/test_location_label.cjs'
      - 'model-comparison.js'
      - 'observation-verification.js'
      - 'tests/test_observation_verification.cjs'
      - 'tests/test_model_compare_snapshots.cjs'
      - 'tests/test_weather_record_integration.cjs'
      - 'tests/test_home_site_navigation.cjs'
      - 'amedas-nearby.js'
      - 'tests/test_amedas_temperature.cjs'
      - 'tests/test_amedas_elevation.cjs'
      - 'tests/test_private_places.cjs'
      - '.github/workflows/home-site-navigation-check.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'sw.js'
      - 'tests/test_weather_watch_sw.cjs'
      - 'weather-watch-auto.js'
      - 'tests/test_weather_watch_auto.cjs'
      - 'location-label.js'
      - 'tests/test_location_label.cjs'
      - 'model-comparison.js'
      - 'observation-verification.js'
      - 'tests/test_observation_verification.cjs'
      - 'tests/test_model_compare_snapshots.cjs'
      - 'tests/test_weather_record_integration.cjs'
      - 'tests/test_home_site_navigation.cjs'
      - 'amedas-nearby.js'
      - 'tests/test_amedas_temperature.cjs'
      - 'tests/test_amedas_elevation.cjs'
      - 'tests/test_private_places.cjs'
      - '.github/workflows/home-site-navigation-check.yml'
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify Home GPS and Sites detail navigation without real GPS
        run: node tests/test_home_site_navigation.cjs
      - name: Verify nearby AMeDAS temperature versus time-aligned forecast
        run: node tests/test_amedas_temperature.cjs
      - name: Verify opt-in GSI elevation and station-height comparison without network
        run: node tests/test_amedas_elevation.cjs
      - name: Verify private place search and favorites without network
        run: node tests/test_private_places.cjs
      - name: Verify current GPS short Japanese area label without external calls
        run: node tests/test_location_label.cjs
      - name: Check pre-record only visual weather observation matching
        run: node tests/test_observation_verification.cjs
      - name: Verify weather code snapshots and fallback without any network
        run: node tests/test_model_compare_snapshots.cjs
      - name: Test recording UI persists verification without harming manual observations
        run: node tests/test_weather_record_integration.cjs
      - name: Check closed-iPhone real push and legacy daily reminder rendering
        run: node tests/test_weather_watch_sw.cjs
      - name: Verify one-time opt-in GPS renewal on app open and safe opt-out
        run: node tests/test_weather_watch_auto.cjs
      - name: Check JavaScript syntax and PWA background script
        run: |
          node --check amedas-nearby.js
          node --check location-label.js
          node --check weather-watch-auto.js
          node --check model-comparison.js
          node --check observation-verification.js
          node --check sw.js
