name: 全国アメダス・３モデル予報の自動検証
on:
  schedule:
    # UTC 00:12, 06:12, 12:12, 18:12 (JST 09:12, 15:12, 21:12, 03:12)
    - cron: '12 0,6,12,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write

concurrency:
  group: jma-national-snapshot
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Report scheduled trigger delay (diagnostic only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/schedule_delay_audit.py
      - name: Check observation quality and precipitation-time tests offline
        run: python3 -m unittest discover -s tests -p test_amedas_snapshot.py -v
      - name: Check 3-model collection and scoring completely offline
        run: python3 -m unittest discover -s tests -p test_three_model_pipeline.py -v
      - name: Test non-corrective elevation/nighttime temperature study offline
        run: python3 -m unittest discover -s tests -p test_terrain_temperature_research.py -v
      - name: Verify high-standard seasonal/monthly correction gate offline
        run: python3 -m unittest discover -s tests -p test_correction_readiness.py -v
      - name: Verify strong-wind and precipitation scoring by month and region offline
        run: python3 -m unittest discover -s tests -p test_forecast_skill_audit.py -v
      - name: Check nationwide scale, offline corrections and fallback circuit breaker
        run: python3 -m unittest discover -s tests -p test_national_shadow_correction.py -v
      - name: Verify incident notification opens once, and closes after recovery
        run: python3 -m unittest discover -s tests -p test_research_failure_issue.py -v
      - name: Collect public JMA nationwide map (at most 3 HTTP GET requests)
        id: amedas
        continue-on-error: true
        run: python3 tools/amedas_snapshot.py
      - name: Analyze paired public-station temperature by elevation, day/night and wind (no network)
        continue-on-error: true
        run: python3 tools/terrain_temperature_research.py
      - name: Capture three batched models for public reference stations
        run: python3 tools/three_model_collect.py
      - name: Score captured forecasts against prior quality-checked observations
        run: python3 tools/score_amedas_models.py
      - name: Audit matched 6/12/24-hour public-station coverage (read only)
        run: python3 tools/match_coverage_audit.py
      - name: Evaluate whether the public research feed is healthy
        run: python3 tools/weather_collection_health.py
      - name: Fail-closed shadow-only correction circuit breaker
        run: python3 tools/correction_guard.py
      - name: Commit only public, bounded research datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/amedas/ data/model-validation/
          if git diff --cached --quiet; then
            echo "No new public weather records"
            exit 0
          fi
          git commit -m "data: nationwide AMeDAS and three-model verification snapshots"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report a sustained research-data outage only once
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/research_failure_issue.py
      - name: Surface AMeDAS API failures without losing the model status report
        if: steps.amedas.outcome == 'failure'
        run: |
          echo "::error::Nationwide AMeDAS collection did not succeed. Inspect the observation step; model status may be unavailable."
          exit 1
