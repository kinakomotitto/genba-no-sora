name: One-time fix for は늘 icon stray line
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/icon-cleanup-once.yml'
permissions:
  contents: write
jobs:
  patch-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Remove stray dash from real PNG icons
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          import math
          
          stamp = "20261111-clean1"
          for size in (180, 192, 512):
              path = Path(f"icon-{size}.png")
              im = Image.open(path).convert("RGBA")
              assert im.size == (size, size), (path, im.size)
              px = im.load()
              xs = range(int(size * 0.30), int(size * 0.42))
              ys = range(int(size * 0.80), int(size * 0.87))
              marks = []
              for y in ys:
                  for x in xs:
                      r, g, b, a = px[x,y]
                      if a > 200 and r < 210 and g < 160 and b < 190:
                          marks.append((x,y))
              if not marks:
                  raise RuntimeError(f"{path}: stray mark was not found: refusing unrelated changes")
              x0 = min(x for x,y in marks)
              x1 = max(x for x,y in marks)
              y0 = min(y for x,y in marks)
              y1 = max(y for x,y in marks)
              if (x1-x0+1) > 0.085*size or (y1-y0+1) > 0.035*size:
                  raise RuntimeError(f"{path}: unexpected component bounds {(x0,y0,x1,y1)}")
              pad = max(2, round(size * .009))
              x0 = max(1,x0-pad); x1 = min(size-2,x1+pad)
              y0 = max(1,y0-pad); y1 = min(size-2,y1+pad)
              print(f"{path}: paint over line in bbox {x0,y0,x1,y1}",flush=True)
              # Copy matching background colors from either side of the isolated dash.
              left_x = max(0,x0-max(5,round(size*.025)))
              right_x = min(size-1,x1+max(5,round(size*.025)))
              for y in range(y0,y1+1):
                  l = px[left_x,y]
                  r = px[right_x,y]
                  for x in range(x0,x1+1):
                      t = (x-left_x)/(right_x-left_x)
                      px[x,y] = tuple(round(l[c]*(1-t)+r[c]*t) for c in range(4))
              # Verify no dark isolated pixels remain in the target region.
              for y in ys:
                  for x in xs:
                      r,g,b,a=px[x,y]
                      if a > 200 and r < 210 and g < 160 and b < 190:
                          raise RuntimeError(f"{path}: residual mark at {x,y}")
              im.save(path, optimize=True)
          
          htmlpath=Path("index.html")
          html=htmlpath.read_text(encoding="utf-8")
          before='<link rel="apple-touch-icon" href="./icon-180.png">'
          after=f'<link rel="apple-touch-icon" href="./icon-180.png?v={stamp}">'
          assert html.count(before)==1, "unexpected apple touch icon tag"
          htmlpath.write_text(html.replace(before,after),encoding="utf-8")
          
          manifest_path=Path("manifest.webmanifest")
          manifest=json.loads(manifest_path.read_text(encoding="utf-8"))
          for ico in manifest["icons"]:
              src=ico["src"]
              if src in ("./icon-192.png","./icon-512.png"):
                  ico["src"]=f"{src}?v={stamp}"
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          
          sw=Path("sw.js")
          code=sw.read_text(encoding="utf-8")
          before="genba-no-sora-shell-v0.42'"
          after="genba-no-sora-shell-v0.42-iconfix1'"
          assert code.count(before)==1,"unexpected cache ID"
          sw.write_text(code.replace(before,after),encoding="utf-8")
          print("Original design preserved, stray line removed, cache-busting links updated",flush=True)
          PY
      - name: Commit exact icon correction and remove this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/icon-cleanup-once.yml
          git add icon-180.png icon-192.png icon-512.png index.html manifest.webmanifest sw.js
          git commit -m 'Fix stray dash under Korean app icon text'
          git push origin HEAD:main
