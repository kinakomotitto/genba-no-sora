# Cloudflare Workers Builds — deployment bootstrap.
# The public HTTP API remains disabled until Cloudflare D1 and the four
# runtime secrets have been configured in the Cloudflare dashboard.
name = "genba-no-sora-noon-push"
main = "src/worker.js"
compatibility_date = "2026-11-09"
workers_dev = true
# Preserve non-secret runtime variables created in the Cloudflare dashboard.
# Never commit VAPID keys or user contact details to this public repository.
keep_vars = true

# D1 database: real production database created in Cloudflare dashboard.
# Contains push subscription endpoints and delivery logs; do not commit data.
[[d1_databases]]
binding = "DB"
database_name = "genba-no-sora-push-private"
database_id = "94a4cd9b-a998-4622-9dbe-4768665b6eff"

# Scheduler enabled after user confirmed actual iPhone test push delivery.
# Runs every 15 minutes; only opted-in subscribers with a matching
# Asia/Tokyo time are eligible. Cron may execute late.
[triggers]
crons = ["*/15 * * * *"]
