# Cloudflare Workers Builds — deployment bootstrap.
# The public HTTP API remains disabled until Cloudflare D1 and the four
# runtime secrets have been configured in the Cloudflare dashboard.
# No scheduler is enabled at bootstrap. After D1, secrets, opt-in, and
# actual iPhone delivery are verified, enable one every-15-minute Cron.
# That cron checks each subscriber's 1-3 chosen times in Japan time.
# [triggers]
# crons = ["*/15 * * * *"]
# Delayed Cron execution is possible; delivery minute is not guaranteed.

name = "genba-no-sora-noon-push"
main = "src/worker.js"
compatibility_date = "2026-11-09"
workers_dev = true

# D1 database: real production database created in Cloudflare dashboard.
# Contains push subscription endpoints and delivery logs; do not commit data.
[[d1_databases]]
binding = "DB"
database_name = "genba-no-sora-push-private"
database_id = "94a4cd9b-a998-4622-9dbe-4768665b6eff"
